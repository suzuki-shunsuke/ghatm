---
name: wc-test
on: workflow_call

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules
        uses: suzuki-shunsuke/download-go-module-action/restore@59ba5863b931de21763c13df6ad926cf98158517 # v0.0.8
        with:
          aqua_version: v2.65.1

      - run: go run ./cmd/ghatm set testdata/before.yaml
      - run: diff testdata/before.yaml testdata/after.yaml
      - run: go run ./cmd/ghatm set -auto
        env:
          GITHUB_TOKEN: ${{github.token}}
      - run: git diff --exit-code .github/workflows/test.yaml
