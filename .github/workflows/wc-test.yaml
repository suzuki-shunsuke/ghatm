---
name: wc-test
on: workflow_call

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules
        uses: suzuki-shunsuke/download-go-module-action/restore@v0.0.10
        with:
          aqua_version: v2.66.1

      - run: go run ./cmd/ghatm set testdata/before.yaml
      - run: diff testdata/before.yaml testdata/after.yaml
      - run: go run ./cmd/ghatm set -auto
        env:
          GITHUB_TOKEN: ${{github.token}}
      - run: git diff --exit-code .github/workflows/test.yaml
