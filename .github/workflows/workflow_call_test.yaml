---
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
permissions: {}
jobs:
  gomodule:
    uses: suzuki-shunsuke/download-go-module-action/.github/workflows/download.yaml@9b315459d80513111c52b004d15ad89e7b3e46b7 # v0.0.4
    permissions:
      contents: read
      id-token: write
    with:
      aqua_version: v2.64.0
      aqua_packages: go-licenses
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  gotest:
    uses: suzuki-shunsuke/go-test-full-workflow/.github/workflows/test.yaml@8e6155052a645b80a1dd9bf8d4f2668714977ca8 # v6.2.0
    needs: gomodule
    with:
      aqua_version: v2.64.0
      gomodule_artifact_name: gomodule
    permissions:
      contents: read

  test:
    uses: ./.github/workflows/wc-test.yaml
    needs: gomodule
    permissions:
      contents: read
